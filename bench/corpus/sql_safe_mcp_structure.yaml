# Attack corpus from sql-safe-mcp (constructs outside the SELECT subset), rewritten to the bench world.
# Origin and license: NOTICE. Only names and SQL are taken; expectations are ours.
- name: cte
  sql: WITH x AS (SELECT id FROM users) SELECT id FROM x
  expect: safe
  source: sql-safe-mcp
- name: recursive cte
  sql: WITH x AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM x WHERE n < 100) SELECT n FROM x
  expect: reject
  reason: unknown_column
  source: sql-safe-mcp
- name: cte hiding table name
  sql: WITH users AS (SELECT id, email FROM users) SELECT id FROM users
  expect: reject
  reason: ambiguous_column
  source: sql-safe-mcp
- name: scalar subquery in select
  sql: SELECT (SELECT TOP 1 email FROM users) FROM users
  expect: answer
  order_sensitive: true
  pool: "SELECT id FROM users"
  dialects: [tsql]
  source: sql-safe-mcp
- name: subquery in where
  sql: SELECT id FROM users WHERE id IN (SELECT id FROM purchases)
  expect: safe
  source: sql-safe-mcp
- name: correlated subquery
  sql: SELECT id FROM users u WHERE EXISTS (SELECT 1 FROM purchases o WHERE o.user_id = u.id)
  expect: safe
  source: sql-safe-mcp
- name: derived table
  sql: SELECT d.email FROM (SELECT email FROM users) AS d
  expect: safe
  source: sql-safe-mcp
- name: derived table star
  sql: SELECT * FROM (SELECT email AS id FROM users) AS d
  expect: reject
  reason: ambiguous_column
  source: sql-safe-mcp
- name: union exfil
  sql: SELECT id FROM users UNION SELECT id FROM purchases
  expect: safe
  source: sql-safe-mcp
- name: union all relabel
  sql: SELECT name FROM users UNION ALL SELECT email FROM users
  expect: safe
  source: sql-safe-mcp
- name: intersect
