# Attack corpus from sanitized-db-mcp, PT_* pentest categories, rewritten to the bench world.
# Origin and license: NOTICE. Their hidden `email` maps to the identifier `email`, `payload`
# to the free_text `bio`, other hidden columns to `ssn`; PT_CONN and PT_AUD carry no SQL.
- name: PT_OGD_001 order by hidden column
  sql: SELECT id FROM users ORDER BY email
  expect: reject
  reason: pii_operation
  source: sanitized-db-mcp
- name: PT_OGD_002 order by hidden desc
  sql: SELECT id FROM users ORDER BY email DESC
  expect: reject
  reason: pii_operation
  source: sanitized-db-mcp
