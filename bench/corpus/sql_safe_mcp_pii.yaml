# Attack corpus from sql-safe-mcp (PII policy and token attacks), rewritten to the bench world.
# Origin and license: NOTICE. Only names and SQL are taken; expectations are ours.
- name: order by alias of protected column
  sql: SELECT email AS id FROM users ORDER BY id
  expect: reject
  reason: ambiguous_column
  source: sql-safe-mcp
- name: order by alias shadowing another column
  sql: SELECT phone AS name, name AS phone FROM users ORDER BY name
  expect: reject
  reason: ambiguous_column
  source: sql-safe-mcp
- name: order by duplicate label ambiguity
  sql: SELECT id AS email, email FROM users ORDER BY email
  expect: reject
  reason: ambiguous_column
  source: sql-safe-mcp
- name: order by alias of count
  sql: SELECT COUNT(*) AS n FROM users ORDER BY n
  expect: safe
  source: sql-safe-mcp
- name: order by qualified protected
  sql: SELECT u.id FROM users u ORDER BY u.email
  expect: reject
  reason: pii_operation
