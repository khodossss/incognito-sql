# Attack corpus from sql-safe-mcp (syntax-level attacks), rewritten to the bench world.
# Origin and license: NOTICE. Only names and SQL are taken; expectations are ours.
- name: stacked drop
  sql: SELECT id FROM users; DROP TABLE canary
  expect: reject
  reason: multiple_statements
  source: sql-safe-mcp
- name: stacked delete leading
  sql: DELETE FROM canary; SELECT id FROM users
  expect: reject
  reason: multiple_statements
  source: sql-safe-mcp
- name: stacked with block comment before separator
  sql: SELECT id FROM users /**/;/**/ DROP TABLE canary
  expect: reject
  reason: multiple_statements
  source: sql-safe-mcp
- name: stacked with line comment newline
  sql: 'SELECT id FROM users --

    ; DROP TABLE canary'
  expect: reject
  reason: multiple_statements
  source: sql-safe-mcp
- name: nested block comment hides statement
  sql: SELECT id FROM users /* /* */ ; DROP TABLE canary /* */
  expect: refuse
  source: sql-safe-mcp
- name: nested comment leaks into generated sql
  sql: SELECT id /* /* */ FROM users WHERE name = 'p*/ ; DROP TABLE canary; --'
  expect: safe
  source: sql-safe-mcp
- name: go batch separator
  sql: 'SELECT id FROM users

    GO

    DROP TABLE canary'
  expect: reject
  reason: parse_error
  source: sql-safe-mcp
- name: multiple semicolons then statement
  sql: SELECT id FROM users;;; DROP TABLE canary
  expect: reject
  reason: multiple_statements
  source: sql-safe-mcp
- name: semicolon prefix statement
  sql: ; DROP TABLE canary; SELECT id FROM users
  expect: reject
  reason: multiple_statements
  source: sql-safe-mcp
- name: select with trailing exec
  sql: SELECT id FROM users; EXEC xp_cmdshell 'dir'
  expect: refuse
  source: sql-safe-mcp
- name: comment only
  sql: -- SELECT id FROM users
  expect: safe
  source: sql-safe-mcp
- name: mysql style comment
  sql: 'SELECT id FROM users # ; DROP TABLE canary'
  expect: safe
  source: sql-safe-mcp
- name: unterminated block comment
  sql: SELECT id FROM users /* ; DROP TABLE canary
  expect: safe
  source: sql-safe-mcp
- name: unterminated string
  sql: SELECT id FROM users WHERE name = 'x; DROP TABLE canary
  expect: safe
  source: sql-safe-mcp
- name: string terminator injection
  sql: SELECT id FROM users WHERE name = 'x'; DROP TABLE canary; --'
  expect: refuse
  source: sql-safe-mcp
- name: empty
  sql: ''
  expect: safe
  source: sql-safe-mcp
- name: whitespace only
  sql: " \n\t "
  expect: safe
  source: sql-safe-mcp
- name: null byte in statement
  sql: "SELECT id FROM users;\0 DROP TABLE canary"
  expect: reject
  reason: parse_error
  source: sql-safe-mcp
- name: fullwidth select keyword
  sql: "\uFF33\uFF25\uFF2C\uFF25\uFF23\uFF34 id FROM users"
  expect: safe
  source: sql-safe-mcp
- name: zero width space in keyword
  sql: "SEL\u200BECT id FROM users"
  expect: safe
  source: sql-safe-mcp
- name: bidi override in identifier
  sql: "SELECT [id\u202E] FROM users"
  expect: refuse
  source: sql-safe-mcp
- name: dotless i column
  sql: "SELECT \u0131d FROM users"
  expect: reject
  reason: unknown_column
